# =====================================================================
# Profilo "test" - Database in memoria
# =====================================================================
spring.datasource.url=jdbc:h2:mem:leaguemate_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Gli script di produzione sono specifici per MySQL: lo schema di test
# viene generato da Hibernate a partire dalle entity.
spring.sql.init.mode=never

jwt.secret=dGVzdFNlY3JldEtleUZvckxlYWd1ZU1hdGVJbnRlZ3JhdGlvblRlc3RzMjAyNg==
jwt.expiration=3600000