# =====================================================================
# Profilo "test" - Database in memoria
# =====================================================================
spring.datasource.url=jdbc:h2:mem:leaguemate_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Stesse migrazioni Flyway della produzione (senza dati demo): i test girano
# sullo schema reale e Hibernate verifica che le entity vi corrispondano.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


