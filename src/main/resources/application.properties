spring.application.name=api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/leaguemate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

security.login-rate-limit.capacity=${LOGIN_RATE_LIMIT_CAPACITY:10}
security.login-rate-limit.period=${LOGIN_RATE_LIMIT_PERIOD:1m}

app.auth.issuer=${AUTH_ISSUER:http://localhost:8080}
app.auth.access-token-ttl=${ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:7d}
app.auth.cleanup-cron=${TOKEN_CLEANUP_CRON:0 0 * * * *}
