# =====================================================================
# LeagueMate API - Configurazione applicativa
# =====================================================================
# Ogni proprieta' e' sovrascrivibile da variabile d'ambiente e ha un
# default valido per lo sviluppo locale: l'applicazione parte senza
# configurazione aggiuntiva, ma in Docker riceve i valori dal compose.
# =====================================================================

spring.application.name=api

# --- Datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/leaguemate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Lo schema è gestito da Flyway: Hibernate si limita a verificare che le
# entity corrispondano alle tabelle e non modifica mai il database.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Disattivato di proposito: con open-in-view la sessione Hibernate resta
# aperta per tutta la richiesta HTTP, mascherando accessi lazy eseguiti
# fuori dai metodi transazionali. Tenerlo spento costringe a caricare
# esplicitamente le associazioni necessarie (JOIN FETCH, @EntityGraph).
spring.jpa.open-in-view=false

# --- Paginazione ---
# Tetto alla dimensione di pagina richiedibile con ?size=
spring.data.web.pageable.max-page-size=100

# --- Migrazioni (Flyway) ---
# db/migration contiene lo schema versionato (V1, V2, ...). I dati demo in
# db/demo vanno aggiunti esplicitamente, es. in Docker:
#   FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/demo
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
# Un database creato prima di Flyway (dal vecchio schema.sql) viene registrato
# come versione 1 e riceve solo le migrazioni successive.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# --- Rate limit sul login (tentativi per IP) ---
security.login-rate-limit.capacity=${LOGIN_RATE_LIMIT_CAPACITY:10}
security.login-rate-limit.period=${LOGIN_RATE_LIMIT_PERIOD:1m}

# --- JWT ---
# Nessun default di proposito: un secret committato nel repository permetterebbe
# a chiunque di firmare token validi. Senza JWT_SECRET l'applicazione non parte.
# Generarlo con: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}